name: Android Build

on:
  push:
    branches: [main]
    paths:
      - 'VoterSlip_AndroidProject.zip'
      - 'patches/apply-feature.py'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q VoterSlip_AndroidProject.zip -d extracted
          python3 patches/apply-feature.py "$GITHUB_WORKSPACE/extracted/VoterSlipApp"
          test -f extracted/VoterSlipApp/app/build.gradle.kts
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/extracted/VoterSlipApp" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: voter-slip-debug-apk
          path: extracted/VoterSlipApp/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

# Trigger build on workflow update.
