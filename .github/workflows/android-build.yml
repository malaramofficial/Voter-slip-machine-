name: Android Build

on:
  push:
    branches: [main]
    paths:
      - 'VoterSlip_AndroidProject.zip'
      - 'patches/apply-feature.py'
      - 'patches/apply-firebase.py'
      - 'patches/apply-auth.py'
      - 'patches/MainActivity.java'
      - 'patches/auth-ui.html'
      - 'firebase/google-services.json'
      - 'firebase.json'
      - 'firestore.rules'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and configure Android project
        env:
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
        run: |
          set -euo pipefail
          unzip -q VoterSlip_AndroidProject.zip -d extracted
          python3 patches/apply-feature.py "$GITHUB_WORKSPACE/extracted/VoterSlipApp"
          if [ -n "${FIREBASE_CONFIG_JSON:-}" ]; then
            printf '%s' "$FIREBASE_CONFIG_JSON" > "$RUNNER_TEMP/google-services.json"
          else
            cp firebase/google-services.json "$RUNNER_TEMP/google-services.json"
          fi
          python3 patches/apply-firebase.py "$GITHUB_WORKSPACE/extracted/VoterSlipApp" "$RUNNER_TEMP/google-services.json"
          python3 patches/apply-auth.py "$GITHUB_WORKSPACE/extracted/VoterSlipApp" "$GITHUB_WORKSPACE/patches"
          test -f extracted/VoterSlipApp/app/google-services.json
          test -f extracted/VoterSlipApp/app/src/main/java/com/example/voterslip/MainActivity.java
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/extracted/VoterSlipApp" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Firebase-enabled debug APK
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug


      - name: Print debug APK signing SHA-1 for Google OAuth setup
        if: success()
        run: |
          if [ -f "$HOME/.android/debug.keystore" ]; then
            keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android 2>/dev/null | grep -E 'SHA1:' || true
          fi

      - name: Deploy Firestore security rules when service credentials are configured
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT secret is not set; Firestore rules are committed but not deployed."
            exit 0
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          npm install --global firebase-tools
          firebase deploy --only firestore:rules --project voter-slip-machine --non-interactive

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: voter-slip-firebase-debug-apk
          path: extracted/VoterSlipApp/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
