<style>
#authGate{position:fixed;inset:0;z-index:99999;background:linear-gradient(145deg,#09213c,#174d70);display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto;font-family:inherit}
#authGate .authbox{width:min(520px,100%);background:#fff;color:#172536;border-radius:18px;padding:22px;box-shadow:0 20px 60px #0005}
#authGate h2{margin:0 0 8px;font-size:23px}#authGate p{line-height:1.55}#authGate button{width:100%;margin:7px 0;padding:12px;border:0;border-radius:9px;background:#155eef;color:#fff;font-weight:700;font-size:15px}
#authGate button.secondary{background:#e9eef5;color:#17324b}#authMsg{background:#f1f5f9;color:#24364a;border-radius:8px;padding:10px;white-space:pre-wrap}
#adminPanel{border:2px solid #0f766e;background:#f0fdfa;padding:12px;border-radius:12px;margin:10px 0;color:#123}
#adminRequests .request,#gateRequests .request{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-top:1px solid #cbd5e1;padding:10px 0}
#adminRequests .request button,#gateRequests .request button{width:auto;padding:8px 12px;margin:2px}#authUser{font-size:13px;color:#526579;overflow-wrap:anywhere}
</style>
<div id="authGate"><div class="authbox">
<h2>🗳️ Voter Slip Machine</h2><p>वोटर डेटा सुरक्षित रखने के लिए Google से लॉगिन करें। नए यूज़र की अनुमति एडमिन देगा।</p>
<div id="authUser"></div><div id="authMsg">लॉगिन की स्थिति जाँची जा रही है…</div>
<button id="googleLogin">🔐 Google से लॉगिन करें</button>
<button id="requestAccess" class="secondary" style="display:none">अनुमति के लिए अनुरोध भेजें</button>
<button id="checkAccess" class="secondary" style="display:none">अनुमति दोबारा जाँचें</button>
<button id="logout" class="secondary" style="display:none">लॉगआउट</button>
<section id="gateAdmin" style="display:none;margin-top:12px"><h3>👑 एडमिन — यूज़र अनुरोध</h3><button id="refreshRequests" class="secondary">अनुरोध रीफ़्रेश करें</button><div id="gateRequests"></div></section>
</div></div>
<section id="adminPanel" style="display:none"><b>👑 एडमिन पैनल — यूज़र अनुमति</b><p style="margin:6px 0">केवल <b>malaramofficial@gmail.com</b> यूज़र अनुरोध मंज़ूर या अस्वीकार कर सकता है।</p><button id="adminRefresh" class="alt">यूज़र अनुरोध रीफ़्रेश करें</button><div id="adminRequests"></div></section>
<script>
(function(){
var approved=false,isAdmin=false,user=null,applying=false,cloudSeen=false,timer=null;
function $(id){return document.getElementById(id)} function msg(t){$('authMsg').textContent=t}
function gate(v){$('authGate').style.display=v?'flex':'none'}
function draw(){ $('googleLogin').style.display=user?'none':'block'; $('requestAccess').style.display=user&&!approved&&!isAdmin&&$('authMsg').textContent.indexOf('अस्वीकृत')<0?'block':'none'; $('checkAccess').style.display=user&&!approved?'block':'none'; $('logout').style.display=user?'block':'none'; $('gateAdmin').style.display=isAdmin?'block':'none'; $('adminPanel').style.display=isAdmin?'block':'none'; $('authUser').textContent=user?(user.name||'')+' • '+(user.email||''):''; }
function onUser(u){user=u;msg('Google लॉगिन सफल। अनुमति जाँची जा रही है…');draw();if(window.AndroidApp)AndroidApp.refreshAccess()}
function onAccess(ok,admin,status){
approved=!!ok;isAdmin=!!admin;if(!user&&window.AndroidApp){try{user=JSON.parse(AndroidApp.getSession()||'null')}catch(e){}}
draw();if(approved||isAdmin){msg(isAdmin?'एडमिन लॉगिन सफल। यूज़र अनुरोध नियंत्रित कर सकते हैं।':'अनुमति मिल गई। साझा डेटा लोड हो रहा है…');gate(false);if(window.AndroidApp)AndroidApp.refreshRequests()}
else{gate(true);if(status==='denied')msg('अनुरोध अस्वीकार किया गया है। एडमिन से संपर्क करें।');else if(status==='pending')msg('अनुमति अनुरोध भेजा जा चुका है। एडमिन की मंज़ूरी का इंतज़ार करें।');else if(status==='none')msg('लॉगिन सफल। वोटर डेटा के लिए अनुमति अनुरोध भेजें।');else msg('पहले Google से लॉगिन करें।');}
}
function state(){var o={};['voterData2','voterEdits2','voterFooter2','voterCuts3'].forEach(function(k){var v=localStorage.getItem(k);if(v!==null)o[k]=v});if(!o.voterData2&&window.VOTER_DATA)o.voterData2=JSON.stringify(window.VOTER_DATA);return o}
function sync(){if(applying||(!approved&&!isAdmin)||!window.AndroidApp)return;clearTimeout(timer);timer=setTimeout(function(){try{AndroidApp.saveSharedState(JSON.stringify(state()))}catch(e){}},700)}
function cloudData(o){if(!approved&&!isAdmin)return;if(!o){if(!cloudSeen){cloudSeen=true;if(isAdmin)sync();else msg('Firebase में अभी डेटा नहीं है। एडमिन के पहली बार सिंक करने का इंतज़ार करें।')}return}cloudSeen=true;applying=true;var changed=false;['voterData2','voterEdits2','voterFooter2','voterCuts3'].forEach(function(k){if(Object.prototype.hasOwnProperty.call(o,k)&&localStorage.getItem(k)!==String(o[k])){localStorage.setItem(k,String(o[k]));changed=true}});applying=false;if(changed)location.reload()}
function requests(list){
function esc(x){return String(x||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var h=(list||[]).map(function(r){return '<div class="request"><span><b>'+esc(r.email)+'</b><br>'+esc(r.name)+'</span><span><button data-approve="'+esc(r.uid)+'" data-email="'+esc(r.email)+'" data-name="'+esc(r.name)+'">मंज़ूर</button><button class="secondary" data-deny="'+esc(r.uid)+'">अस्वीकार</button></span></div>'}).join('')||'<p>अभी कोई लंबित अनुरोध नहीं है।</p>';
$('gateRequests').innerHTML=h;$('adminRequests').innerHTML=h;
}
function requestClick(e){var a=e.target.closest('[data-approve]'),d=e.target.closest('[data-deny]');if(a&&window.AndroidApp)AndroidApp.approveUser(a.dataset.approve,a.dataset.email,a.dataset.name);if(d&&window.AndroidApp)AndroidApp.denyUser(d.dataset.deny)}
window.AuthUI={syncLocal:sync,onUser:onUser,onAccess:onAccess,onCloudData:cloudData,onRequests:requests,onAdminAction:function(t){msg(t);if(window.AndroidApp)AndroidApp.refreshRequests()},onError:function(t){msg(t)},onSignedOut:function(){user=null;approved=false;isAdmin=false;gate(true);draw();msg('लॉगआउट हो गया।')}};
$('googleLogin').onclick=function(){if(window.AndroidApp)AndroidApp.signIn();else msg('Firebase-enabled Android APK आवश्यक है।')};
$('requestAccess').onclick=function(){if(window.AndroidApp)AndroidApp.requestAccess()};$('checkAccess').onclick=function(){if(window.AndroidApp)AndroidApp.refreshAccess()};
$('logout').onclick=function(){if(window.AndroidApp)AndroidApp.signOut()};
$('refreshRequests').onclick=$('adminRefresh').onclick=function(){if(window.AndroidApp)AndroidApp.refreshRequests()};
$('gateRequests').addEventListener('click',requestClick);$('adminRequests').addEventListener('click',requestClick);
if(window.AndroidApp){try{var u=JSON.parse(AndroidApp.getSession()||'null');if(u)onUser(u);else onAccess(false,false,'signedout')}catch(e){onAccess(false,false,'signedout')}}else{gate(true);msg('Firebase-enabled Android APK आवश्यक है।')}
})();
</script>
